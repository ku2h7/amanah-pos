[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Force npm usage
  NPM_CONFIG_PREFER_OFFLINE = "false"
  NPM_CONFIG_AUDIT = "false"

# Disable yarn detection
[build.processing]
  skip_processing = false

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
