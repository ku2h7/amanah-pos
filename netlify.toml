[build]
  command = "npm run netlify-build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Force npm usage and disable yarn
  NPM_CONFIG_PREFER_OFFLINE = "false"
  NPM_CONFIG_AUDIT = "false"
  YARN_ENABLE = "false"
  USE_NPM = "true"
  DISABLE_YARN = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
